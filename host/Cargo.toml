[package]
name = "airlock"
version = "0.2.1"
edition = "2021"

[lib]
name = "airlock_core"
path = "src/lib.rs"

[[bin]]
name = "airlock"
path = "src/main.rs"

[dependencies]
airlock-proto = { path = "../proto" }
anyhow = "1"
flate2 = "1"
sha2 = "0.10"
png = "0.17"
serde_json = "1"
unicode-normalization = "0.1.25"
unicode-general-category = "1.1.0"
ureq = "2"
httpdate = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
backhand = { version = "0.25", default-features = false, features = ["gzip"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_Security"] }
